name: Release

# Ein Tag wie v0.1.0 baut ein signiertes APK und veröffentlicht es als GitHub-Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Abhängigkeiten
        run: flutter pub get

      - name: Unit-Tests
        run: flutter test

      - name: Release-Schlüssel einrichten
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 fehlt. Ohne festen Schlüssel könnten Updates nicht über die installierte App installiert werden (Datenverlust). Siehe README → Release-Schlüssel."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Versionsnummer aus Tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: APK bauen (arm64)
        run: >
          flutter build apk --release --target-platform android-arm64
          --build-name=${{ steps.ver.outputs.name }}
          --build-number=${{ steps.ver.outputs.code }}

      - name: APK umbenennen
        run: cp build/app/outputs/flutter-apk/app-release.apk "WaescheWer-${{ steps.ver.outputs.name }}.apk"

      - name: GitHub-Release
        uses: softprops/action-gh-release@v2
        with:
          files: WaescheWer-${{ steps.ver.outputs.name }}.apk
          generate_release_notes: true
          body: |
            **Installation:** Diese Seite am Handy öffnen, die APK unten antippen, laden und installieren
            („Unbekannte Apps installieren“ einmalig erlauben). Updates installieren sich über die vorhandene App, die Daten bleiben erhalten.

            **Bitte testen:** [Testplan – Neu in dieser Version](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/TESTPLAN.md)
